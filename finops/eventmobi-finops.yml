description: >-
  FinOps view of EventMobi spend. EventMobi is licensed as an event management
  platform, billed per event or per year rather than as a metered API. The
  Unified API carries no separate per-call charge - it is a capability of an
  Organizer account - so the cost drivers are the platform plan itself plus
  event-scoped add-ons (badge hardware rental, pre-printed badges, streaming and
  video storage packs) and any custom/enterprise agreement. Cost predictability
  is high because charges are packaged and event-scoped rather than
  usage-metered on API calls.
notes: >-
  List prices referenced here are indicative and not reconciled; confirm on
  eventmobi.com/pricing or with EventMobi sales. There is no public evidence of
  usage-based API metering, so API spend is effectively bundled into the plan.
