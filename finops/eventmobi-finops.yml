  - event
principles:
- name: Visibility
  description: Track spend per event and per annual subscription; itemize add-ons (badges, hardware, streaming) separately from the base plan.
- name: Allocation
  description: Map each per-event license to the specific event/program and cost center it supports.
- name: Optimization
  description: For multi-event programs, compare stacked per-event licenses against the annual unlimited-events plan; scope add-ons to the events that need them.
- name: Accountability
  description: Assign an owner per event; review add-on charges against the base plan before each event and renewal.
