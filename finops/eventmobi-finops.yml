meters:
- name: per_event_license
  description: Single-event platform license (module bundles priced separately).
  unit: events
  aggregation: sum
  dimensions:
  - account
  - event
- name: annual_subscription
  description: Annual unlimited-events subscription.
  unit: subscriptions
  aggregation: sum
  dimensions:
  - account
- name: badge_hardware
  description: Badge printer/iPad hardware rental packages, per rental period.
  unit: rentals
  aggregation: sum
  dimensions:
