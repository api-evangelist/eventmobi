apis:
- aid: eventmobi:eventmobi-events-api
  name: EventMobi Events API
  tags:
  - Events
  - Experience Manager
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.eventmobi.com/latest/
  baseURL: https://uapi.eventmobi.com
  properties:
  - url: https://developers.eventmobi.com/latest/
    type: Documentation
  - url: https://developers.eventmobi.com/docs/uapi-public/YXBpOjI5Njc2MDM1-event-mobi-api
    type: APIReference
  description: >-
    Read and update the events an Organizer manages. Confirmed request patterns
    include GET and PATCH on the events collection and nested resources such as
    /events/{event_id}/images/. Each API key is scoped to the Organizer that
    generated it. Full CRUD verb/path coverage is endpointsModeled - the public
    reference is served from a gated developer portal and the complete surface
    was not machine-extractable at review time.
- aid: eventmobi:eventmobi-people-api
  name: EventMobi People API
  tags:
  - People
  - Attendees
  - Speakers
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.eventmobi.com/latest/
  baseURL: https://uapi.eventmobi.com
  properties:
  - url: https://developers.eventmobi.com/latest/
    type: Documentation
  description: >-
    Manage the people associated with an event - attendees, speakers, and other
    participants - including their profile fields and visibility, which are
    controlled by authorization level. People are organized into groups (see the
    Groups API). Endpoints are nested under an event. Exact verb/path coverage is
    endpointsModeled.
