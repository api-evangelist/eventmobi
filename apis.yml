aid: eventmobi
url: https://raw.githubusercontent.com/api-evangelist/eventmobi/refs/heads/main/apis.yml
name: EventMobi
kind: company
description: >-
  EventMobi is an event management platform for in-person, virtual, and hybrid
  events - event apps, registration and ticketing, event websites, badges and
  check-in, and live engagement - all configured through its Experience Manager.
  EventMobi exposes a documented public Unified API (UAPI) that lets organizers
  programmatically read and manage the data behind an event: events, people
  (attendees, speakers, and other participants), sessions, companies (sponsors
  and exhibitors), and groups. Access is gated by an EventMobi Organizer
  account - API keys are generated inside Experience Manager and carry the same
  access rights as the Organizer they belong to - so the API is available to
  paying customers rather than through open self-service signup.
